name: CI

on:
    push:
        branches:  [main, 'feat/**', 'fix/**']
    pull_request:
        branches:  [main]
    workflow_dispatch:

permissions:
    contents: read

env:
    NODE_VERSION: '22'

jobs:
    server:
        name: back-end
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        env:
            DATABASE_URL: "file:./dev.db"
        steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Install Node.js
          uses: actions/setup-node@v5
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: npm
            cache-dependency-path: server/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Prisma client generation
          run: npm run prisma:generate

        - name: Build back-end
          run: npm run build

        - name: Run back-end tests
          run: npm run test:coverage

        - name: Publish test coverage report
          uses: actions/upload-artifact@v4
          with:
            name: coverage-server
            path: server/coverage/lcov.info
            retention-days: 7

    client:
        name: front-end
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Install Node.js
          uses: actions/setup-node@v5
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: npm
            cache-dependency-path: client/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Typecheck front-end
          run: npm run typecheck

        - name: Build front-end
          run: npm run build

        - name: Run front-end tests
          run: npm run test:coverage

        - name: Publish test coverage report
          uses: actions/upload-artifact@v4
          with:
            name: coverage-client
            path: client/coverage/lcov.info
            retention-days: 7
    
    sonar:
        name: SonarQube Cloud
        runs-on: ubuntu-latest
        needs: [server, client]
        continue-on-error: true
        
        steps:
        - name: Checkout repository
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
        
        - name: Back-end coverage
          uses: actions/download-artifact@v4
          with:
            name: coverage-server
            path: server/coverage

        - name: Front-end coverage
          uses: actions/download-artifact@v4
          with:
            name: coverage-client
            path: client/coverage

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
          env:
            SonarCloud: ${{ secrets.SONAR_TOKEN }}
