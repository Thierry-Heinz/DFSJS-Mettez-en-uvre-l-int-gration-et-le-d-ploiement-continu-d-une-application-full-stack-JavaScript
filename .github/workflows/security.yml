# ---------------------------------------------------------------------------
# Orion CRM — analyse de sécurité des images
#
# Exécution planifiée chaque nuit.
#
# ---------------------------------------------------------------------------

name: Sécurité

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:       

permissions:
  contents: read
  security-events: write

jobs:

  images:
    name: Analyze docker images
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      # --- Back-end ---------------------------------------------------------
      - name: build back-end
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: false
          load: true
          tags: orion-server:scan


      - name: analyse back-end
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: orion-server:scan
          format: sarif
          output: trivy-server.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true


      - name: publish back-end results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-server.sarif
          category: trivy-server


      # --- Front-end --------------------------------------------------------
      - name: build front-end
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: false
          load: true
          tags: orion-client:scan

      - name: analyze front-end
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: orion-client:scan
          format: sarif
          output: trivy-client.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: publish front-end results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-client.sarif
          category: trivy-client

      # --- Résumé lisible dans le journal d'exécution ------------------------
      - name: Display summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: orion-server:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true