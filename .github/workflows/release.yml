# ---------------------------------------------------------------------------
# Orion CRM — Publication d'une version
#
# Déclenché par un tag de version poussé depuis la ligne de commande :
#     git tag v1.0.0 && git push origin v1.0.0
#
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  # -------------------------------------------------------------------------
  # 1. On ne publie rien qui n'ait pas été vérifié
  # -------------------------------------------------------------------------
  ci:
    name: Vérifications
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # -------------------------------------------------------------------------
  # 2. Artefacts et release GitHub
  # -------------------------------------------------------------------------
  release:
    name: Créer la release
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: write

    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Construire le back-end
        working-directory: server
        run: |
          npm ci
          npm run prisma:generate
          npm run build

      - name: Construire le front-end
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Préparer les archives
        run: |
          mkdir -p artefacts
          TAG="${{ github.ref_name }}"

          tar -czf "artefacts/orion-server-${TAG}.tar.gz" \
              -C server dist package.json package-lock.json prisma

          tar -czf "artefacts/orion-client-${TAG}.tar.gz" \
              -C client dist

          echo "Contenu des archives :"
          tar -tzf "artefacts/orion-server-${TAG}.tar.gz" | head -20
          tar -tzf "artefacts/orion-client-${TAG}.tar.gz" | head -10


      - name: Créer la release et y joindre les artefacts
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artefacts/orion-server-${{ github.ref_name }}.tar.gz
            artefacts/orion-client-${{ github.ref_name }}.tar.gz

  # -------------------------------------------------------------------------
  # 3. Images publiées sur le registre
  # -------------------------------------------------------------------------
  images:
    name: Publier les images
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Se connecter au registre
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Publier l'image du back-end
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/thierry-heinz/orion-server:${{ github.ref_name }}
            ghcr.io/thierry-heinz/orion-server:latest


      - name: Publier l'image du front-end
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/thierry-heinz/orion-client:${{ github.ref_name }}
            ghcr.io/thierry-heinz/orion-client:latest

# ---------------------------------------------------------------------------
# PUBLIER UNE VERSION
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Notes
#
# 1. L'événement `push` doit être sur la branche par défaut (main)
#
# 2. Les paquets publiés sont PRIVÉS par défaut. Il faut les rendre publiques.
#
# 3. Supprimer une version publiée par erreur :
#       git tag -d v1.0.0 && git push origin :refs/tags/v1.0.0
#    puis supprimer la release et l'image depuis l'interface.
# ---------------------------------------------------------------------------