# ---------------------------------------------------------------------------
# Orion CRM — orchestration locale
#
# Lancement :  docker compose up -d --build
# Arrêt      :  docker compose down          (persistance des données)
# Remise à zéro : docker compose down -v     (⚠ supprime la base)
# ---------------------------------------------------------------------------

name: orion-crm

services:

  # -------------------------------------------------------------------------
  # BACK-END — Express + Prisma + SQLite
  # -------------------------------------------------------------------------
  server:
    build:
      context: ./server
    image: ghcr.io/${GHCR_OWNER:-orion}/orion-server:${TAG:-latest}

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: file:/app/data/orion.db

    expose:
      - "8080"

    volumes:
      - orion-data:/app/data

    networks:
      - orion-net

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------------
  # FRONT-END — build statique servi par nginx, proxy /api vers le back
  # -------------------------------------------------------------------------
  client:
    build:
      context: ./client
    image: ghcr.io/${GHCR_OWNER:-orion}/orion-client:${TAG:-latest}

    restart: unless-stopped

    ports:
      - "4200:8080"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - orion-net

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
volumes:
  orion-data:

networks:
  orion-net:
    driver: bridge

# ---------------------------------------------------------------------------
# À SAVOIR

#
