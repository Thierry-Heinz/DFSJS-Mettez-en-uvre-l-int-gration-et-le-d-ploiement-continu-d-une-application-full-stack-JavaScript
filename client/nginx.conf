# ---------------------------------------------------------------------------
# Orion CRM — configuration nginx du front
# Copiée dans /etc/nginx/conf.d/default.conf par le Dockerfile.
# ---------------------------------------------------------------------------

server {
    # Port > 1024 : nginx tourne en utilisateur non privilégié (voir Dockerfile)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression des fichiers texte ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- En-têtes de sécurité (OWASP A05) ---

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;   # ne pas divulguer la version de nginx

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API : proxy vers le service back du docker-compose ---
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Routage SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Logs : conservés localement (docker logs) + envoyés à Logstash ---
    access_log /dev/stdout;
    access_log syslog:server=host.docker.internal:5140,tag=nginx_access;

    error_log /dev/stderr warn;
    error_log syslog:server=host.docker.internal:5140,tag=nginx_error warn;
}